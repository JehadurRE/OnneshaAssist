services:
  - type: web
    name: onnesha-exam-platform
    runtime: node
    plan: starter
    region: singapore
    numInstances: 1
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    disk:
      name: onnesha-data
      mountPath: /opt/render/project/src/.data
      # 5 GB: ~232 practical submissions (PDF/ZIP) + store headroom. Increase to 10 GB for video.
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: NITRO_PRESET
        value: node-server
      - key: DATA_DIR
        value: /opt/render/project/src/.data



