services:
  - type: web
    name: onnesha-exam-platform
    runtime: node
    plan: starter
    region: singapore
    numInstances: 1
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NITRO_PRESET
        value: node-server



