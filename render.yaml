services:
  - type: web
    name: onnesha-exam-platform
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NITRO_PRESET
        value: node-server
      - key: DATA_DIR
        value: /var/data
    disk:
      name: onnesha-persistent-data
      mountPath: /var/data
      sizeGB: 2


