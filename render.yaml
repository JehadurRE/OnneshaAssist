services:
  - type: web
    name: onnesha-arena
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
    disk:
      name: onnesha-persistent-data
      mountPath: /var/data
      sizeGB: 2

